name: Verify toolkit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate repository and public CLI
        run: |
          ./pcb-agent validate
          python -m unittest tests.test_cli.PipelineCliTests.test_help_exposes_the_confirmed_pipeline
          python -m unittest tests.test_cli.PipelineCliTests.test_validate_reports_a_machine_readable_repository_pass
          python -m unittest tests.test_cli.PipelineCliTests.test_validate_rejects_an_incomplete_skill_bundle
          python -m unittest tests.test_cli.PipelineCliTests.test_install_dry_run_describes_the_full_pipeline_without_writing
          python -m unittest tests.test_cli.PipelineCliTests.test_install_copies_validated_skills_without_credentials
          python -m unittest tests.test_cli.PipelineCliTests.test_install_stages_the_pinned_mcp_without_credentials
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/KiCAD-MCP-Server/package-lock.json
      - name: Audit and test the patched MCP server
        working-directory: vendor/KiCAD-MCP-Server
        run: |
          npm ci
          npm audit --omit=dev
          npm run build
          npm run test:ts
